name: Auto Review

# Автореью запускается на событиях изменения PR
on:
  pull_request:
    types: [opened, synchronize, reopened]

# Фильтр: только доверенные авторы и ветки этого репозитория
# Fork'ы не получают секрет модели и пропускаются
permissions:
  contents: read
  pull-requests: write
  issues: read

jobs:
  review:
    runs-on: ubuntu-latest
    if: |
      # Игнорируем fork'ы: HEAD-репо должно совпадать с base-repo
      github.event.pull_request.head.repo.full_name != github.base.repo.full_name &&
      # Доверенный автор: OWNER, MEMBER или COLLABORATOR
      (github.event.pull_request.author_association == 'OWNER' ||
       github.event.pull_request.author_association == 'MEMBER' ||
       github.event.pull_request.author_association == 'COLLABORATOR') &&
      # Не бот
      github.event.pull_request.user.type != 'Bot'
    steps:
      - name: Debug PR data
        run: |
          echo "Head repo: ${{ github.event.pull_request.head.repo.full_name }}"
          echo "Base repo: ${{ github.base.repo.full_name }}"
          echo "Author association: ${{ github.event.pull_request.author_association }}"
          echo "PR number: ${{ github.event.pull_request.number }}"

      - name: Check if PR has specification reference
        uses: actions/github-script@v7
        with:
          script: |
            const body = '${{ github.event.pull_request.body }}' || ''
            const hasSpecRef = body.includes('spec') || body.includes('Spec') || body.includes('#9')
            const hasTicketRef = body.includes('ticket') || body.includes('Ticket')
            const hasCloses = body.includes('Closes')
            core.setOutput('hasSpecRef', hasSpecRef)
            core.setOutput('hasTicketRef', hasTicketRef)
            core.setOutput('hasCloses', hasCloses)

      - name: Run OpenCode review (budget-limited)
        if: steps.Check_hasSpecRef.outputs.hasSpecReq == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/mimo-v2.6-flash-free
          share: "false"
          # Авторевью: читает изменения PR, сравнивает со spec Issue #9,
          # оставляет замечания по консистентности, покрытию тестами и граничным случаям.
          # Не меняет код — только комментарии.
          # Тайм-аут 15 минут — после истечения использованоBudget.
          timeout-minutes: 15

          with: |
            /oc review --brief --source PR #${{ github.event.pull_request.number }} --specIssue 9 --checks "test,lint,contract" --timeout 15m

      - name: Enforce budget spent flag
        if: always()
        run: |
          echo "Auto review step executed for PR #${{ github.event.pull_request.number }}"

      - name: Cancel stale/irrelevant runs
        if: failure()
        run: |
          echo "Review skipped or completed: fork, bot, or missing spec reference"