name: Auto Review

# Автоматическое ревью PR: открытие или обновление PR запускает агента.
# PR из fork и от ботов пропускаются — они не должны получать секреты
# и тратить бюджет модели. Ревьюер только комментирует, код меняет автор PR.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  id-token: write # OIDC-токен обменивается на токен GitHub App (ревью, комментарии)
  contents: read
  pull-requests: write # gh: ревью и комментарии к строкам diff
  issues: write # комментарии к PR идут через issues API

jobs:
  review:
    if: |
      github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name &&
      github.event.pull_request.user.type != 'Bot' &&
      (
        github.event.pull_request.author_association == 'OWNER' ||
        github.event.pull_request.author_association == 'MEMBER' ||
        github.event.pull_request.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    # Ограничение бюджета: одно ревью — не дольше 25 минут.
    timeout-minutes: 25
    # Новый коммит в тот же PR отменяет устаревшее ревью.
    concurrency:
      group: review-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # В headless-режиме запрос прав никто не подтверждает — прогон зависает
      # до тайм-аута (тикет #6). Внешние пути разрешаем целиком (раннер
      # одноразовый), зацикливание блокируем.
      - name: Headless permissions
        shell: bash
        run: |
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.json" <<'EOF'
          {
            "permission": {
              "external_directory": { "*": "allow" },
              "doom_loop": "deny"
            }
          }
          EOF

      - name: Run OpenCode review
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          model: opencode/mimo-v2.6-flash-free
          share: "false"
          prompt: |
            Проведи ревью pull request #${{ github.event.pull_request.number }}
            (ветка `${{ github.event.pull_request.head.ref }}`) по скиллу code-review.

            Смотри только diff `git diff origin/main...HEAD` и затронутые файлы.
            Не запускай тесты, не проверяй права и токены, пробных комментариев
            не создавай.

            1. Сверь изменения со спецификацией и тикетами, если они относятся к задаче,
               и с критериями из REVIEW.md.
            2. Проверь тесты: покрыт ли основной сценарий, негативный и соседний.
            3. Проверь контрактную цепочку contract/main.tsp → openapi.yaml → SDK
               и отсутствие ручных правок сгенерированных файлов.
            4. Проверь права и секреты в изменениях воркфлоу.

            Построчные замечания оставь одной командой на замечание (FILE и LINE —
            из diff, LINE должна быть добавленной строкой):
            `gh api repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/comments -f body="..." -f path="FILE" -f commit_id="${{ github.event.pull_request.head.sha }}" -F line=LINE -f side=RIGHT`

            Если вызов вернул ошибку — не повторяй больше одного раза, перечисли
            замечание в ответе. Код не меняй и не пушь. Итог напиши в ответе:
            экшен сам опубликует его комментарием к PR. Если дефектов нет, так и напиши.
