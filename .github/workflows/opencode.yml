# Агент OpenCode в GitHub Actions: вызов по команде из комментария
# к issue или pull request. Описание — раздел «Агент OpenCode в
# GitHub Actions» в README.md.
name: opencode

# События вызова агента:
# - issue_comment: создан комментарий в issue или PR
# - pull_request_review_comment: создан комментарий к строке diff в PR
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    # Фильтр до работы агента: команда в тексте + доверенный автор.
    # Комментарии ботов игнорируются — агент не отвечает на свои
    # собственные сообщения. PR из fork пропускаются: на review-комментарии
    # checkout берёт код PR, а форку секреты не выдаются.
    if: |
      github.event.comment.user.type != 'Bot' &&
      (
        contains(github.event.comment.body, '/oc') ||
        contains(github.event.comment.body, '/opencode')
      ) &&
      (
        github.event.comment.author_association == 'OWNER' ||
        github.event.comment.author_association == 'MEMBER' ||
        github.event.comment.author_association == 'COLLABORATOR'
      ) &&
      (
        github.event.pull_request == null ||
        github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name
      )
    runs-on: ubuntu-latest
    # Задание с агентом не виснет бесконечно. Запас на длинные прогоны
    # (to-spec/to-tickets); зависания на запросе прав исключены шагом
    # «Headless permissions» ниже (тикет #6).
    timeout-minutes: 30
    # Параллельные запуски по одному issue/PR: новый прогон отменяет
    # текущий, чтобы агенты не отвечали в обсуждении одновременно.
    concurrency:
      group: opencode-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: true
    # Стандартная авторизация OpenCode: чтение репозитория +
    # OIDC-токен, который обменивается на токен GitHub App.
    # Права на запись даёт сам App, GITHUB_TOKEN в checkout не сохраняется.
    # actions: read — история прогонов для бюджета PR;
    # issues: write + pull-requests: write — комментарий об исчерпании
    # бюджета в PR (без модели); pull-requests также даёт head SHA.
    permissions:
      id-token: write
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      # Предел запусков на PR: не больше трёх допущенных запросов человека
      # к агенту (общий и построчный комментарии, плюс re-run считается как
      # отдельная попытка). Счётчик берём из истории Actions — источник,
      # который токен агента не переписывает; комментарий в PR только отчёт.
      - name: Check PR run budget
        id: budget
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number || github.event.pull_request.number }}
          IS_PR: ${{ github.event.issue.pull_request != null || github.event_name == 'pull_request_review_comment' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          MAX=3

          if [ "$IS_PR" != "true" ]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TITLE=$(gh api "repos/$REPO/issues/$PR" --jq .title)
          USED=0
          for event in issue_comment pull_request_review_comment; do
            sum=$(gh api --paginate --slurp "repos/$REPO/actions/runs?event=$event&per_page=100" \
              | jq --arg t "$TITLE" '[.[].workflow_runs[] | select(.display_title == $t and .conclusion != "skipped") | .run_attempt] | add // 0')
            USED=$((USED + sum))
          done
          echo "budget: used=$USED max=$MAX"

          # Текущий прогон уже учтён в истории, поэтому третий запуск
          # (used == MAX) ещё допускается, а четвёртый — нет.
          if [ "$USED" -gt "$MAX" ]; then
            HEAD_SHA=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
            gh api -X POST "repos/$REPO/issues/$PR/comments" -f body="## Бюджет запусков агента исчерпан — \`limit_exhausted\`

          Для PR #$PR разрешено не больше $MAX допущенных запусков агента; этот запрос — $USED-й. Модель не вызывалась.

          - **Последний SHA:** \`$HEAD_SHA\`
          - **Логи:** $RUN_URL
          - **Статус:** нужен человек

          Следующее действие выбирает человек: оставить изменение как есть, продолжить вручную или открыть новый PR — у него будет свой бюджет."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          fi

      # Глобальный конфиг OpenCode для headless-раннера: запрос прав
      # (`permission: ask`) никто не подтверждает, и прогон зависает до
      # тайм-аута (тикет #6). Внешние пути (~/.config/gh, ~/.config/configstore
      # от npx и т.п.) разрешаем целиком — раннер одноразовый; зацикливание
      # блокируется (doom_loop: deny), а не висит на запросе. Локальные
      # сессии этот конфиг не затрагивает — в проектном opencode.json
      # permission не задан, действует безопасный `ask` по умолчанию.
      - name: Headless permissions
        if: steps.budget.outputs.allowed == 'true'
        shell: bash
        run: |
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.json" <<'EOF'
          {
            "permission": {
              "external_directory": { "*": "allow" },
              "doom_loop": "deny"
            }
          }
          EOF

      # Скиллы (.agents/skills/), настройки трекера (docs/agents/) и
      # правила (AGENTS.md) приезжают с checkout — отдельная установка
      # на раннере не нужна.
      - name: Run OpenCode
        if: steps.budget.outputs.allowed == 'true'
        uses: anomalyco/opencode/github@latest
        env:
          # Ключ модели — только из Secrets, в репозиторий не попадает
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: opencode/mimo-v2.6-flash-free
          # Публикация сессий агента выключена: решение зафиксировано
          # в README.md
          share: "false"
          # mentions не задаём — работают команды по умолчанию /opencode и /oc