name: Auto Triage

# Авторазбор нового обращения: агент оставляет комментарий с разбором,
# метка needs-triage ставится автоматически. Обращения от ботов и готовые
# тикеты (ready-for-agent) пропускаются — их разбирать не нужно.
on:
  issues:
    types: [opened]

permissions:
  id-token: write # OIDC-токен обменивается на токен GitHub App (комментарии)
  contents: read
  issues: write # gh: поставить метку needs-triage

jobs:
  triage:
    if: |
      github.event.issue.user.type != 'Bot' &&
      (
        github.event.issue.author_association == 'OWNER' ||
        github.event.issue.author_association == 'MEMBER' ||
        github.event.issue.author_association == 'COLLABORATOR' ||
        github.event.issue.author_association == 'CONTRIBUTOR'
      ) &&
      !contains(github.event.issue.labels.*.name, 'ready-for-agent')
    runs-on: ubuntu-latest
    # Разбор не должен тратить бюджет бесконечно.
    timeout-minutes: 15
    # Ограничение параллельных запусков: один разбор на issue.
    concurrency:
      group: triage-${{ github.event.issue.number }}
      cancel-in-progress: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Mark issue as needs-triage
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue edit "${{ github.event.issue.number }}" --add-label needs-triage

      # В headless-режиме запрос прав никто не подтверждает — прогон зависает
      # до тайм-аута (тикет #6). Внешние пути разрешаем целиком (раннер
      # одноразовый), зацикливание блокируем.
      - name: Headless permissions
        shell: bash
        run: |
          mkdir -p "$HOME/.config/opencode"
          cat > "$HOME/.config/opencode/opencode.json" <<'EOF'
          {
            "permission": {
              "external_directory": { "*": "allow" },
              "doom_loop": "deny"
            }
          }
          EOF

      - name: Run OpenCode triage
        uses: anomalyco/opencode/github@latest
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        with:
          model: ${{ vars.OPENCODE_MODEL || 'opencode/mimo-v2.6-flash-free' }}
          share: "false"
          prompt: |
            Новое обращение — issue #${{ github.event.issue.number }}.

            Разбери его по настройкам проекта: docs/agents/issue-tracker.md,
            AGENTS.md, GLOSSARY.md и контракт contract/main.tsp.

            1. Потребность пользователя своими словами, без технического решения.
            2. Что уже умеет приложение: конкретные поля контракта и эндпоинты.
            3. Сценарии: основной, негативный, соседний.
            4. Швы для тестов и пороговые значения.
            5. Категория (bug / enhancement) и готовность: ready-for-agent или нужен разбор.

            Разбор должен стать итоговым ответом — экшен сам опубликует его
            комментарием к issue. Не публикуй комментарий самостоятельно
            (никаких `gh issue comment` и `gh api` для комментариев).
            Спеку и тикеты не создавай — их оформляет человек командой /oc
            со скиллами to-spec и to-tickets после согласования. Метки, кроме
            уже стоящей needs-triage, не меняй. Права и токены не проверяй.
