name: Auto Triage

# Событие: новое обращение в Issues
on:
  issues:
    types: [opened]

# Фильтр: доверенный автор + метка не ready-for-agent (готовые тикеты пропускаем)
permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    if: |
      github.event.issue.author_association != 'Bot' &&
      github.event.issue.labels.none(label => label.name == 'ready-for-agent')
    steps:
      - name: Apply triage prompt
        uses: actions/github-script@v7
        with:
          script: |
            // Get the issue body, default to empty if missing
            const body = github.event.issue.body || ''
            const bodySnippet = body.length > 500 ? body.substring(0, 500) + '...' : body

            const prompt = `## Тройной разбор нового обращения

Это автоматический предварительный разбор нового issue.

**1. Главная потребность пользователя (самими словами, без технического решения):**
> ${bodySnippet}

**2. Что уже умеет приложение (по контракту/коду):**
> Проверьте contract/main.tsp, openapi.yaml, сгенерированный SDK. Есть ли уже поля, покрывающие потребность? Назовите конкретные поля и эндпоинты.

**3. Сценарии (основной, негативный, соседний):**
>- **Основной:** ... (опишите, как должно работать в happy path)
>- **Негативный:** ... (что происходит при ошибке/отсутствии данных)
>- **Соседний:** ... (какое поведение должно сохраниться без изменений)

**4. Пороговые значения и границы тестирования (швы):**
>- ...

**5. Вывод:**
>- Категория (bug / enhancement)?
>- Готово к реализации (ready-for-agent) или нужен дополнительный разбор?

---
> *This was generated by AI during triage.*

`

            // Apply label needs-triage if not already present
            const labels = github.event.issue.labels.map(l => l.name)
            if (!labels.includes('needs-triage')) {
              github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['needs-triage']
              })
            }
            // Add comment with prompt
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: prompt
           )

      - name: Enforce timeout (cancel if stuck)
        if: always()
        run: |
          echo "Triage run completed or timed out"