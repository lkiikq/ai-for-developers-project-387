name: Auto Triage

# Событие: новое обращение в Issues
on:
  issues:
    types: [opened]

# Фильтр: не бот + метка не ready-for-agent (готовые тикеты пропускаем)
permissions:
  issues: write
  contents: read

jobs:
  triage:
    runs-on: ubuntu-latest
    if: |
      github.event.issue.author_association != 'Bot' &&
      github.event.issue.labels.none(label => label.name == 'ready-for-agent')
    steps:
      - name: Debug event data
        run: |
          echo "Author association: ${{ github.event.issue.author_association }}"
          echo "Labels: ${{ join(',', github.event.issue.labels.*.name) }}"
          echo "Body length: ${{ github.event.issue.body?.length || 0 }}"
      - name: Apply triage prompt
        uses: actions/github-script@v7
        with:
          script: |
            const body = github.event.issue.body || ''
            const bodySnippet = body.length > 500 ? body.substring(0, 500) + '...' : body
            const prompt = `## Тройной разбор\n\n**1. Потребность:** ${bodySnippet}\n\n---`
            // Add label needs-triage
            github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['needs-triage']
            })
            // Add comment
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: prompt
            })